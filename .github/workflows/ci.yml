name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payflow_test
          POSTGRES_PASSWORD: payflow_test
          POSTGRES_DB: payflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U payflow_test -d payflow_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://payflow_test:payflow_test@localhost:5433/payflow_test

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run db:migrate:test
      - run: npm run test:integration
